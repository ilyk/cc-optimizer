version: '3.8'

services:
  backend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
    container_name: ccoptimizer-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://ccuser:.7931505@db:5432/ccoptimizer
      - DB_TYPE=postgres
    env_file:
      - ../../backend/.env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ccoptimizer-network

  db:
    image: postgres:15-alpine
    container_name: ccoptimizer-db
    environment:
      - POSTGRES_DB=ccoptimizer
      - POSTGRES_USER=ccuser
      - POSTGRES_PASSWORD=".7931505"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccuser -d ccoptimizer"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ccoptimizer-network

volumes:
  postgres_data:
    driver: local

networks:
  ccoptimizer-network:
    driver: bridge
